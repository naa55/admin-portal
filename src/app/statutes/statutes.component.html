<app-alert #alert></app-alert>
<div class="d-flex justify-content-end mx-3">
  <!-- <button type="button" class="btn btn-primary">Add User</button> -->
  <button
    type="button"
    class="btn btn-primary"
    data-bs-toggle="modal"
    data-bs-target="#exampleLargeModal"
    (click)="open(statutesModal)"
  >
    Add Statutes
  </button>
</div>
<div class="card mt-2">
  <div class="card-body">
    <div class="d-lg-flex align-items-center mb-4 gap-3">
      <div class="position-relative mb-2">
        <input type="text" class="form-control ps-5 radius-10" [(ngModel)]="statute_title" placeholder="Title" 
           />
      </div>
      <div class="position-relative mb-2">
        <!-- <input type="date" class="form-control ps-5 radius-10" [(ngModel)]="year_of_act" placeholder="Year od Act"/> -->

        <div>
          <select class="p-2 rounded" [(ngModel)]="year_of_act">
            <option value="" disabled selected>Year Of Act</option>
            <!-- Options for Regions -->
            <option value="2024">2024</option>
            <option value="2023">2023</option>
            <option value="2022">2022</option>
            <option value="2021">2021</option>
            <option value="2020">2020</option>
            <option value="2019">2019</option>
            <option value="2018">2018</option>
            <option value="2017">2017</option>
            <option value="2016">2016</option>
            <option value="2015">2015</option>
            <option value="2014">2014</option>
            <option value="2013">2013</option>
          </select>
        </div>
      </div>
      <div class="mb-2">
        <button type="submit" (click)="searchStatutes()" class="btn btn-primary">Search</button>
      </div>
    </div>
    <div class="table-responsive-sm">
      <table class="table table-striped table-bordered align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th>Title</th>
            <th>Year of Act</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody
          
        >
          <tr *ngFor="let item of statutesArray | paginate: { itemsPerPage: 10, currentPage: p }">
            <td>{{ item.title}}</td>
            <td>{{ item.year_of_act }}</td>
            <td>
              <div class="dropdown">
                <button
                  class="btn btn-primary dropdown-toggle"
                  type="button"
                  data-bs-toggle="dropdown"
                  aria-expanded="false"
                >
                  Action
                </button>
                <ul class="dropdown-menu">
                  <li
                    (click)="edit(item,statutesModal)"
                    class="dropdown-item"
                    data-bs-toggle="modal"
                    data-bs-target="#exampleLargeModal"
                  >
                    Edit
                  </li>
                  <!-- <li (click)="view(item)" class="dropdown-item">View</li> -->
                  <li (click)="delete(item.id)" class="dropdown-item">
                    Delete
                  </li>
                </ul>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<div style="float: right; margin-bottom: 50px">
  <pagination-controls (pageChange)="p = $event"></pagination-controls>
</div>

<ng-template #statutesModal let-c="close" let-d="dismiss">

      <div class="modal-header">
        <h5 class="modal-title">Statutes</h5>
        <button
          type="button"
          class="btn-close"
          (click)="close()"
          aria-label="Close"
        ></button>
      </div>
      <div class="modal-body">
        <form class="my-4" [formGroup]="statutesForm">
          <div class="row">
            <div class="col-sm-12">
              <label class="form-label">Statutes Title</label>
              <input
                type="text"
                formControlName="statute_title"
                class="form-control form-control-lg"
              />
            </div>
          </div>
          <div class="row">
            <div class="col-sm-12">
              <label class="form-label">Year of Act</label>
              <input
                type="date"
                formControlName="year_of_act"
                class="form-control form-control-lg"
              />
            </div>
          </div>
          <div class="row mt-2">
            <div class="col-6">
              <label class="form-label">Statutes File </label>
              <label class="text-danger">*All upload file</label>
              <input
                type="file"
                (change)="onFileChange($event)"
                formControlName="statute_file"
                accept=".pdf,.docx,.doc,.xlsx,.xls,.csv"
                class="form-control form-control-lg"
              />
            </div>
          </div>
        </form>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            (click)="close()"
          >Close
          </button>
          <button
            type="button"
            class="btn btn-primary"
            (click)="statutes_id ? update() : store()"
          >
          <span
              [ngClass]="{ 'spinner-border': isLoading }"
              style="font-size: 10px; height: 20px; width: 20px"
              role="status"
            >
        </span>
            {{ statutes_id ? " Update " : "Save changes" }}
          </button>
        </div>
      </div>
    
</ng-template>
